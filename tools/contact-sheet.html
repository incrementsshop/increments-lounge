<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cut-out QA</title>
<style>
  :root { --bg: #efe7da; --ink: #2b1e17; --line: #d8cbb6; }
  body { margin: 0; font: 13px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--ink); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px 20px; }
  figure { margin: 0; border: 1px solid var(--line); background: #e6dccb; padding: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 170px; }
  .pair > * { width: 100%; height: 100%; object-fit: contain; }
  .pair canvas { background: repeating-conic-gradient(#d9ccb8 0 25%, #e8dfd0 0 50%) 0 0 / 14px 14px; }
  figcaption b { display: inline-block; padding: 0 5px; border-radius: 3px; background: var(--ink); color: var(--bg); }
  figcaption b.photo { background: #8c2027; }
</style>
</head>
<body>
<header>Cut-out QA — every product image as the Lounge sees it. <span id="sum"></span></header>
<main id="grid"></main>
<script type="module">
  import { prepareProductImage, shopifyImage } from '../assets/js/scene/cutout.js';
  const catalog = await fetch('../data/catalog.json').then(r => r.json());
  const grid = document.getElementById('grid');
  const tally = { cutout: 0, photo: 0 };
  for (const p of catalog.products) {
    const srcs = [...new Set([...(p.colours.map(c => c.image).filter(Boolean)), p.images[0]?.src].filter(Boolean))];
    for (const src of srcs) {
      const fig = document.createElement('figure');
      const pair = document.createElement('div'); pair.className = 'pair';
      const img = new Image(); img.src = shopifyImage(src, 300);
      pair.append(img);
      fig.append(pair);
      const cap = document.createElement('figcaption');
      fig.append(cap);
      grid.append(fig);
      prepareProductImage(src).then(r => {
        tally[r.kind]++;
        pair.append(r.canvas);
        cap.innerHTML = `<b class="${r.kind}">${r.kind}</b> ${p.zone} · ${p.title} · ${src.split('/').pop()}`;
        document.getElementById('sum').textContent = JSON.stringify(tally);
      }).catch(e => { cap.textContent = 'ERROR ' + e.message; });
    }
  }
</script>
</body>
</html>
