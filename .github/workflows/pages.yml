# Publishes the Lounge to GitHub Pages on every push to main (including the
# catalog refreshes committed by refresh-catalog.yml).
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # used by refresh-catalog.yml (pushes made by GITHUB_TOKEN don't trigger `push`)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # when called after a catalog refresh, deploy the commit it just pushed

      # Only the site ships — tools/, docs/ and dev config stay out of the public build.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html 404.html robots.txt assets data _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          rm -f _site/data/merch.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
