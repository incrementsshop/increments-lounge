# Keeps data/catalog.json in step with the live Shopify store (prices, stock,
# new colourways). Scheduled hourly (GitHub often runs it only every few hours);
# the script retries when Shopify is busy. Commits only when something actually changed,
# which then triggers the Pages deploy.

name: Refresh catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # to look up when the last good refresh was

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # If Shopify doesn't answer (it turns cloud runners away for hours at a time), keep the
      # last snapshot and pass with a warning; only fail — and email — once the catalog
      # hasn't refreshed for a whole day.
      - name: Snapshot the store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/refresh_catalog.py
          code=$?
          if [ "$code" -eq 75 ]; then
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-catalog.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt')
            age=$(( $(date +%s) - $(date -d "${last:-now}" +%s) ))
            if [ "$age" -lt 86400 ]; then
              echo "::warning::Shopify didn't answer this time; keeping the last snapshot (last good refresh: ${last:-unknown})."
              exit 0
            fi
            echo "::error::The store hasn't answered for over a day (last good refresh: ${last:-unknown}). Prices and stock in the Lounge are going stale."
          fi
          exit "$code"

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "increments-lounge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "Refresh catalog snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
