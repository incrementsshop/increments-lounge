# Keeps data/catalog.json in step with the live Shopify store (prices, stock,
# new colourways). Scheduled hourly (GitHub often runs it only every few hours);
# the script retries when Shopify is busy. Commits only when something actually changed,
# which then triggers the Pages deploy.

name: Refresh catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot the store
        run: python3 tools/refresh_catalog.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "increments-lounge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "Refresh catalog snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
